name: Release

# Publishes @uxdata-co/kie to npm when package.json's version lands on main and hasn't
# been released yet. Uses npm trusted publishing (OIDC): no NPM_TOKEN secret anywhere,
# and every tarball carries a provenance attestation linking it to this repo, workflow
# and commit. The version tag (vX.Y.Z) and GitHub release are created by this workflow,
# not by hand.
on:
  push:
    branches: [main]

permissions:
  contents: write   # create + push the tag and the GitHub release
  id-token: write   # OIDC token for npm provenance

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: kie
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: kie/package-lock.json

      - name: Determine whether this version needs releasing
        id: check
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git tag -l "v$VERSION" | grep -q .; then
            echo "Tag v$VERSION already exists locally — already released, skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if npm view "@uxdata-co/kie@$VERSION" version >/dev/null 2>&1; then
            echo "@uxdata-co/kie@$VERSION already on npm — already released, skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - run: npm ci
        if: steps.check.outputs.should_release == 'true'

      - run: npm test
        if: steps.check.outputs.should_release == 'true'

      - name: Assert zero runtime dependencies
        if: steps.check.outputs.should_release == 'true'
        run: node -e "const d=require('./package.json').dependencies||{}; if(Object.keys(d).length){console.error('runtime deps found:',d);process.exit(1)}"

      # Trusted publishing (OIDC) needs npm >= 11.5; Node 22 ships npm 10.
      - name: Upgrade npm for OIDC trusted publishing
        if: steps.check.outputs.should_release == 'true'
        run: npm install -g npm@latest && npm --version

      - name: Publish to npm (provenance)
        if: steps.check.outputs.should_release == 'true'
        run: npm publish --provenance --access public

      - name: Create and push tag
        if: steps.check.outputs.should_release == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          VERSION="${{ steps.check.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Extract changelog section
        id: notes
        if: steps.check.outputs.should_release == 'true'
        working-directory: .
        run: |
          V="${{ steps.check.outputs.version }}"
          awk -v v="$V" '
            $0 ~ "^## \\["v"\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > /tmp/notes.md
          echo "file=/tmp/notes.md" >> "$GITHUB_OUTPUT"

      - name: GitHub release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.check.outputs.version }}
          tag_name: v${{ steps.check.outputs.version }}
          body_path: ${{ steps.notes.outputs.file }}

      - name: Already released
        if: steps.check.outputs.should_release == 'false'
        run: echo "Version ${{ steps.check.outputs.version }} is already released — skipping publish/tag/release."

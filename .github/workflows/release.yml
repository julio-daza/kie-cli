name: Release

# Publishes @uxdata-co/kie to npm when a version tag is pushed (v0.3.0, v1.2.3 …).
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret anywhere, and every tarball
# carries a provenance attestation linking it to this repo, workflow and commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release
  id-token: write   # OIDC token for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: kie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: kie/package-lock.json
      - run: npm ci
      - run: npm test

      - name: Tag must match package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          test "$PKG" = "$TAG" || { echo "package.json is $PKG but tag is $TAG"; exit 1; }

      - name: Assert zero runtime dependencies
        run: node -e "const d=require('./package.json').dependencies||{}; if(Object.keys(d).length){console.error('runtime deps found:',d);process.exit(1)}"

      - name: Publish to npm (provenance)
        run: npm publish --provenance --access public

      - name: Extract changelog section
        id: notes
        working-directory: .
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '
            $0 ~ "^## \\["v"\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > /tmp/notes.md
          echo "file=/tmp/notes.md" >> "$GITHUB_OUTPUT"

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.file }}
